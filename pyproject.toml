[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "db-data-validator"
version = "1.0.0"
description = "Desktop app for reviewing duplicate primary keys in Excel or CSV data files."
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "openpyxl>=3.1,<4",
]

[project.scripts]
db-data-validator = "db_data_validator.main_window:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
